# This is a basic workflow that is manually triggered

name: Manual workflow

# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  push:
    branches: [ "main"]
  workflow_dispatch:
    # inputs:
    #   tag_name:
    #     description: 'The Git tag for this release (e.g., v1.0.0, v1.0.1)'
    #     required: true
    #     type: string
    # Inputs the workflow accepts.


# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  release:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    permissions:
      contents: write

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a single command using the runners shell
    - uses: actions/checkout@v4
      name: checkout the repod pack
    - name: go into pack dir
      run: cd $GITHUB_WORKSPACE
    - name: repack the pack
      run: zip -r pack.zip pack.mcmeta pack.png assets/ LICENSE
    
    - name: upload pack
      run: "curl --request POST --url 'https://civlabs.org/filebrowser/api/resources?path=%2Fcontent%2Fdownloads%2Fpack.zip&source=srv&override=true' --header 'Authorization: Bearer eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJGaWxlQnJvd3NlciBRdWFudHVtIiwiZXhwIjoxODExODgzMDUxLCJpYXQiOjE3ODA3NzkwNTEsImJlbG9uZ3NUbyI6MSwiUGVybWlzc2lvbnMiOnsiYXBpIjp0cnVlLCJhZG1pbiI6ZmFsc2UsIm1vZGlmeSI6dHJ1ZSwic2hhcmUiOmZhbHNlLCJyZWFsdGltZSI6ZmFsc2UsImRlbGV0ZSI6dHJ1ZSwiY3JlYXRlIjp0cnVlLCJkb3dubG9hZCI6ZmFsc2V9fQ.JQVrazmyDLljkkMRGttpDqfoEcvNIoGM0RbCFejBZkQ' --header 'Content-Type: application/zip' --header 'accept: application/json' --data-binary @pack.zip"

